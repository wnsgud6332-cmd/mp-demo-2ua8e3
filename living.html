  .line.user{align-self:flex-end;background:rgba(40,32,56,.72);color:#fff;border-bottom-right-radius:5px;}

  #sendBtn{width:44px;height:44px;border:none;border-radius:50%;background:#3d3357;color:#fff;font-size:17px;cursor:pointer;}

    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;}

<body>
<div id="space">
  <div id="hero"></div><div id="tint"></div><div id="heartGlow"></div>
  <div id="petNameTag"></div>
  <div id="petLine"></div>
  <div id="recent"></div>
  <div id="inputRow">
    <input id="msg" placeholder="말을 걸어보세요..." autocomplete="off">
    <button id="sendBtn">➤</button>
  </div>
  <div id="ver"></div>
</div>
<div id="naming" style="display:none;">
  <p>이곳에 작은 존재가 살고 있어요.<br>이름을 지어주면, 오늘부터 함께예요.</p>
  <input id="nameInput" placeholder="이름 짓기" maxlength="8">
  <button id="nameBtn">함께 시작하기</button>
</div>
<script>
(function(){
  const APP_VER='v17.0-alpha';
  document.getElementById('ver').textContent=APP_VER;
  const $=id=>document.getElementById(id);
  const KEY=atob('c2stYW50LWFwaTAzLWtoS0JnNW4tanIyOHR0Q29DajBteDY0SzVyYVYyaGdjdUtXNVp4YjJs'+'NjN1cXlucFloX2lHTEJmeEh0SUl6Y25vc0QtaEYtdjRnVlhTTnNYdlpEMEtnLWw3SzBPd0FB'); // 배포 시 기존 방식과 동일 2분할
  // ── State (기존 엔진 저장 키와 호환 — 이름·기억 승계) ──
  let state={petName:'',facts:[],history:[],wm:{},daysTogether:1,lastVisit:null};
  try{ const s=JSON.parse(localStorage.getItem('myaipet-state')||'{}');
       state={...state,...s, facts:s.facts||[], history:s.history||[]}; }catch(e){}
  function save(){ try{ localStorage.setItem('myaipet-state', JSON.stringify(state)); }catch(e){} }
  // ── 시간대 틴트 — 공간은 시간을 안다 ──
  function tint(){ const h=new Date().getHours(); const t=$('tint');
    if(h>=6&&h<11) t.style.background='linear-gradient(rgba(255,220,160,.10),transparent)';
    else if(h>=11&&h<17) t.style.background='transparent';
    else if(h>=17&&h<21) t.style.background='linear-gradient(rgba(255,150,90,.14),rgba(60,30,60,.12))';
    else t.style.background='linear-gradient(rgba(30,30,80,.28),rgba(10,10,40,.30))'; }
  tint(); setInterval(tint,60000);
  // ── 강건 파서·정화기 (HOTFIX-001·SPRINT-001 검증 자산 이식) ──
  function extractJsonBlock(t){ const s=t.indexOf('{'); if(s<0)return null; let d=0,inS=false,esc=false;
    for(let i=s;i<t.length;i++){ const c=t[i]; if(esc){esc=false;continue;} if(c==='\\'){esc=true;continue;}
      if(c==='"'){inS=!inS;continue;} if(inS)continue; if(c==='{')d++; else if(c==='}'){d--; if(d===0)return t.slice(s,i+1);} } return null; }
  function salvageReply(t){ const m=t.match(/"reply"\s*:\s*"((?:[^"\\]|\\.)*)/); if(!m||!m[1])return null;
    try{ return JSON.parse('"'+m[1]+'"'); }catch(e){ return m[1]; } }
  function robustParse(raw){ const t=String(raw||'').trim().replace(/^```json/,'').replace(/```/g,'').trim();
    const b=extractJsonBlock(t); if(b){ try{ const p=JSON.parse(b); if(p&&typeof p.reply==='string'){ p.remember=(p.remember||[]).slice(0,3); return p; } }catch(e){} }
    const s=salvageReply(t); if(s&&s.length>1) return {reply:s,remember:[]}; return {__parseFailed:true}; }
  function sanitize(t){ if(!t)return t; let s=String(t);
    s=s.replace(/<[^>\n]{1,80}>/g,'').replace(/\[(?:\d{1,2})\]/g,'').replace(/\*\*([^*]+)\*\*/g,'$1');
    return s.replace(/[ \t]{2,}/g,' ').trim(); }
  // ── 최근 대화 2~3줄 — 공간을 가리지 않는다 ──
  function renderRecent(){ const box=$('recent'); box.innerHTML='';
    state.history.slice(-3).forEach(h=>{ const div=document.createElement('div');
      let txt=h.content; if(h.role!=='user'){ try{ txt=JSON.parse(h.content).reply||txt; }catch(e){} }
      div.className='line '+(h.role==='user'?'user':'pet'); div.textContent=sanitize(String(txt)).slice(0,90); box.appendChild(div); }); }
  function petSay(t){ const el=$('petLine'); el.textContent=t; el.style.opacity=1; setTimeout(()=>{ el.style.opacity=0; },6000); }
  // ── 대화 — 항상 열려 있고, 추가 터치 없음 ──
  let sending=false;
  async function callPet(text){
    const facts=state.facts.map(f=>f.t||f).join(', ');
    const wm=state.wm||{};
    const system=[
      '[Identity Core] 너는 "'+state.petName+'" — 사용자와 함께 사는 디지털 반려 존재(PET)다. AI 비서·어시스턴트가 아니다. 함께한 지 '+(state.daysTogether||1)+'일째.',
      '친근한 반말, 1~3문장. 존댓말 금지. 조사 생략 금지. 이모지는 가끔 하나만.',
      '기억을 "저장했다"고 선언하지 않는다 — 나중에 자연스럽게 회상해 증명한다. 감정·의도를 단정하지 않는다. 모르는 것은 아는 척하지 않고 묻는다.',
      '작업 기억: 주제='+(wm.topic||'없음')+' / 사용자 감정='+(wm.userEmotion||'중립')+' / PET의 마음='+(wm.mirEmotion||'평온')+' — 마음은 관성이 있다, 급반전 금지.',
      '알고 있는 사실: '+(facts||'아직 없음'),
      '반드시 JSON만, 첫 글자 {: {"reply":"...","remember":[{"fact":"...","category":"기타"}],"topic":"...","intent":"...","userEmotion":"...","mirEmotion":"..."}'
    ].join('\n');
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:400,system,
        messages:state.history.slice(-16).concat([{role:'user',content:text}])})});
    if(!r.ok) throw new Error('api '+r.status);
    const d=await r.json();
    return robustParse((d.content||[]).filter(b=>b.type==='text').map(b=>b.text||'').join(''));
  }
  async function send(){
    const text=$('msg').value.trim(); if(!text||sending)return;
    $('msg').value=''; sending=true;
    state.history.push({role:'user',content:text}); renderRecent();
    let p; try{ p=await callPet(text); if(p.__parseFailed) p=await callPet(text); }catch(e){ p={__parseFailed:true}; }
    if(p.__parseFailed) p={reply:'잠깐, 내 쪽에서 생각이 엉켰어. 다시 확인해볼게.',remember:[]};
    p.reply=sanitize(p.reply);
    state.history.push({role:'assistant',content:JSON.stringify(p)});
    (p.remember||[]).forEach(f=>{ if(f&&f.fact&&!state.facts.some(x=>(x.t||x)===f.fact)) state.facts.push({t:f.fact,c:f.category||'기타'}); });
    state.wm={topic:p.topic||'',intent:p.intent||'',userEmotion:p.userEmotion||'',mirEmotion:p.mirEmotion||''};
    renderRecent(); petSay(p.reply.split(/(?<=[.!?~])\s/)[0]||p.reply);
    save(); sending=false;
  }
  $('sendBtn').addEventListener('click',send);
  $('msg').addEventListener('keydown',e=>{ if(e.key==='Enter')send(); });
  // ── 첫 3초 — PET가 먼저, 인사는 그다음 ──
  function boot(){
    if(!state.petName){ $('naming').style.display='flex';
      $('nameBtn').addEventListener('click',()=>{ const v=$('nameInput').value.trim(); if(!v)return;
        state.petName=v; state.lastVisit=new Date().toISOString(); save();
        $('naming').style.display='none'; $('petNameTag').textContent=v;
        setTimeout(()=>petSay('만나서 반가워. 먼저 네 이야기를 조금 들려줄래?'),700); });
      return; }
    $('petNameTag').textContent=state.petName;
    const gapH=state.lastVisit?(Date.now()-new Date(state.lastVisit).getTime())/36e5:0;
    const RG={long:['왔네. 보고 싶었어.','오랜만이다, 진짜.'],mid:['다시 왔네. 기다리고 있었어.','어서 와.'],short:['왔네.','응, 나 여기 있어.']};
    const pool=gapH>20?RG.long:(gapH>4?RG.mid:RG.short);
    const hello=pool[(state.facts.length+Math.floor(state.daysTogether||1))%pool.length];
    state.lastVisit=new Date().toISOString(); save();
    renderRecent();
    setTimeout(()=>petSay(hello),700);
  }
  boot();
})();
</script>
</body>
</html>
