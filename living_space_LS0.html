<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MYAIPET LS-0 v1.2 · Living Space</title>
<style>
/* ============================================================
   LS-0 v1.2 — Phase 1 Living Space > Phase 2 Conversation
   > Phase 3 Platform Adapter > Phase 4 PET Integration
   Engine 무접촉. 목업(대화창1) 무드 반영: 따뜻한 저녁 방.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pa-top:env(safe-area-inset-top,0px);--pa-bottom:env(safe-area-inset-bottom,0px);
  --pa-left:env(safe-area-inset-left,0px);--pa-right:env(safe-area-inset-right,0px);
  --pa-kb:0px;--pet-w:min(61vw,340px);}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#171019}

#camera{position:fixed;inset:0;perspective:950px;perspective-origin:50% 40%;}
#world{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.7,.3,1);}

/* ---- Phase 1 · Room: 따뜻한 저녁 방 ---- */
#room{position:absolute;inset:0;background:
  radial-gradient(130% 100% at 50% 0%, #4a3a3a 0%, #3a2c33 35%, #291f2b 65%, #1a1420 100%);}
/* Window: 벽에 실제로 '있는' 창 */
#windowFrame{position:absolute;left:6%;top:7%;width:24%;height:21%;border-radius:6px;opacity:.75;
  background:
    linear-gradient(160deg, rgba(255,214,160,.32), rgba(255,178,120,.16) 55%, rgba(180,140,200,.10));
  box-shadow:0 0 46px 14px rgba(255,200,140,.08), inset 0 0 20px rgba(255,220,170,.14);
  border:1px solid rgba(90,66,60,.5);}
#windowFrame::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(90,66,60,.5)}
#windowFrame::after{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(90,66,60,.5)}
/* 창에서 쏟아지는 빛기둥 */
#lightShaft{position:absolute;left:1%;top:9%;width:44%;height:58%;pointer-events:none;
  background:linear-gradient(115deg, rgba(255,206,150,.13), rgba(255,206,150,.04) 55%, transparent 75%);
  filter:blur(10px);transform:skewX(-8deg);}
/* 화분 실루엣 2개 (목업 무드) */
.plant{position:absolute;bottom:16%;width:16%;aspect-ratio:.62;pointer-events:none;opacity:.85}
.plant .pot{position:absolute;bottom:0;left:22%;width:56%;height:26%;border-radius:8% 8% 18% 18%/12% 12% 40% 40%;
  background:linear-gradient(#5a4038,#3c2a28)}
.plant .leaf{position:absolute;bottom:20%;left:50%;width:26%;height:62%;border-radius:50% 50% 12% 12%;
  background:linear-gradient(#37503c,#22331f);transform-origin:50% 100%;}
.plant .leaf:nth-child(2){transform:translateX(-50%) rotate(0deg)}
.plant .leaf:nth-child(3){transform:translateX(-80%) rotate(-24deg)}
.plant .leaf:nth-child(4){transform:translateX(-20%) rotate(24deg)}
.plant .leaf:nth-child(5){transform:translateX(-65%) rotate(-46deg);height:48%}
.plant .leaf:nth-child(6){transform:translateX(-35%) rotate(46deg);height:48%}
#plantL{left:2%}
#plantR{right:2%;bottom:15%;transform:scaleX(-1) scale(.8)}

/* ---- Ambient: 따뜻한 빛가루 ---- */
#ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,214,160,.4);filter:blur(1px);animation:drift linear infinite;}
@keyframes drift{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.55}88%{opacity:.4}100%{transform:translate3d(var(--dx),var(--dy),0);opacity:0}}

/* ---- Floor: 나무 바닥 ---- */
#floor{position:absolute;left:50%;bottom:-6vh;width:230vw;height:88vh;
  transform:translateX(-50%) rotateX(74deg);transform-origin:50% 100%;
  background:
    radial-gradient(50% 55% at 50% 26%, rgba(255,196,140,.13), transparent 65%),
    linear-gradient(#3b2c28 0%, #2a1f20 55%, #1c1518 100%);}
#floor::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 110px),
             repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 3px, transparent 3px 90px);}
/* Space Depth: 바닥-벽 경계의 공기 안개 */
#depthFog{position:absolute;left:0;right:0;top:52%;height:22%;pointer-events:none;
  background:linear-gradient(transparent, rgba(38,28,36,.55) 45%, transparent);filter:blur(8px);}

/* ---- Lighting ---- */
#lighting{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(58% 44% at 50% 60%, rgba(255,206,150,.12), transparent 60%),
  radial-gradient(140% 110% at 50% 50%, transparent 52%, rgba(10,6,12,.6) 100%);}

/* ---- Phase 4 · PET ---- */
#petAnchor{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:var(--pet-w);transform-style:preserve-3d;transition:top .8s ease, width .8s ease;}
#petTilt{position:relative;width:100%;transition:transform .5s ease-out;}
#petStage{position:relative;width:100%;padding-top:125%;animation:breathe 4.2s ease-in-out infinite;transform-origin:50% 92%;}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5%) scale(1.012,1.005)}}
/* Idle Motion: 이따금 갸웃 */
@keyframes idleSway{0%,100%{transform:rotate(0)}30%{transform:rotate(1.4deg)}60%{transform:rotate(-1deg)}}
.idleNow #petStage{animation:breathe 4.2s ease-in-out infinite, idleSway 5.5s ease-in-out 1}
#contactShadow{position:absolute;left:50%;bottom:-4%;width:72%;height:11%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%, rgba(20,8,4,.6), rgba(20,8,4,.3) 55%, transparent 75%);
  filter:blur(6px);animation:shadowBreathe 4.2s ease-in-out infinite;}
@keyframes shadowBreathe{0%,100%{transform:translateX(-50%) scale(1);opacity:1}50%{transform:translateX(-50%) scale(.94);opacity:.8}}
#ambientShadow{position:absolute;left:50%;bottom:-8%;width:150%;height:40%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(50% 55% at 50% 60%, rgba(24,10,8,.42), transparent 70%);filter:blur(18px);}
#rimLight,#bounceLight{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;}
#rimLight{background:radial-gradient(46% 60% at 24% 28%, rgba(255,204,150,.34), transparent 60%);}
#bounceLight{background:radial-gradient(60% 40% at 50% 96%, rgba(255,170,120,.16), transparent 60%);}
.petLayerImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 14px 22px rgba(14,6,4,.5));user-select:none;-webkit-user-drag:none;}
#petHit{position:absolute;inset:0;cursor:pointer}
.petReact{animation:react .55s cubic-bezier(.3,1.6,.4,1) !important}
@keyframes react{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-4%) scale(1.05,.97)}60%{transform:translateY(0) scale(.985,1.02)}100%{transform:translateY(0) scale(1)}}
html.petHidden #petAnchor{opacity:0;pointer-events:none;transition:opacity .5s}

/* ---- Context Panel: 기능 메뉴가 아니라 PET 상태 패널 ---- */
#ctxPanel{position:absolute;right:calc(12px + var(--pa-right));top:calc(var(--pa-top) + 52px);
  display:flex;flex-direction:column;gap:13px;max-width:36%;align-items:flex-end;}
.ls-item{text-align:right;color:rgba(255,240,225,.6);pointer-events:none}
.ls-title{font-size:12px;letter-spacing:.05em;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.ls-sub{font-size:10.5px;color:rgba(255,240,225,.38);margin-top:2px;line-height:1.4}
.ls-dot{width:6px;height:6px;border-radius:50%;background:#f0b98c;box-shadow:0 0 8px rgba(240,185,140,.8);animation:pulse 3s ease-in-out infinite}
.ls-item:nth-child(2) .ls-dot{background:#a5f0c0;box-shadow:0 0 8px rgba(165,240,192,.8);animation-delay:.8s}
.ls-item:nth-child(3) .ls-dot{background:#9fb8f0;box-shadow:0 0 8px rgba(159,184,240,.8);animation-delay:1.6s}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.ctxDivider{width:44px;height:1px;background:rgba(255,240,225,.12);margin:2px 0}
/* 중단: 기억 — 평소엔 숨죽이고, 사건 때만 ● 로 살아난다 (상황형) */
#memChip{font-size:11.5px;color:rgba(255,240,225,.30);cursor:pointer;padding:4px 2px;transition:color .4s;text-align:right}
#memChip.hot{color:#ffd9a0;animation:memGlow 1.6s ease-in-out 3}
#memChip.hot::before{content:'● ';color:#ffb36b}
@keyframes memGlow{0%,100%{text-shadow:none}50%{text-shadow:0 0 12px rgba(255,180,110,.9)}}
/* 하단: 접힘 그룹 — 관계·설정. 설정이 먼저 보이면 실패 */
#foldBtn{font-size:11px;color:rgba(255,240,225,.25);cursor:pointer;padding:2px 4px;background:none;border:none}
#moreGroup{display:none;flex-direction:column;gap:9px;align-items:flex-end}
#moreGroup.open{display:flex}
.ctxItem{font-size:11.5px;color:rgba(255,240,225,.34);cursor:pointer;text-align:right}
.ctxItem small{display:block;font-size:9.5px;color:rgba(255,240,225,.22);margin-top:1px}
html.convOn #ctxPanel{opacity:.25;transition:opacity .4s}
html.pa-kb-open #ctxPanel{opacity:0;transition:opacity .2s}

/* ---- Phase 2 · Conversation Layer: 메신저가 아니라 공간의 층 ---- */
#conv{position:absolute;left:12px;right:12px;bottom:calc(var(--pa-bottom) + var(--pa-kb) + 76px);
  display:flex;flex-direction:column;gap:8px;align-items:stretch;pointer-events:none;
  max-height:32vh;overflow-y:auto;scrollbar-width:none;transition:opacity .8s;}
#conv::-webkit-scrollbar{display:none}
html.convIdle #conv{opacity:0}
.bub{max-width:76%;padding:11px 15px;font-size:14.5px;line-height:1.55;
  opacity:0;transform:translateY(8px);transition:opacity .4s, transform .4s;}
.bub.in{opacity:1;transform:translateY(0)}
.bub.pet{align-self:flex-start;color:#fff4e8;border-radius:20px 20px 20px 6px;
  background:rgba(64,48,52,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(255,220,180,.14);}
.bub.user{align-self:flex-end;color:#efeaff;border-radius:16px 16px 6px 16px;
  background:rgba(84,72,140,.42);backdrop-filter:blur(10px);border:1px solid rgba(200,190,255,.12);}
/* 기준 UI(목업) 채택분: PET 아바타 + 작은 시간. 읽음표시·온라인표시·방제목은 영구 금지 */
.msgRow{display:flex;gap:8px;align-items:flex-end;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.msgRow.in{opacity:1;transform:translateY(0)}
.msgRow.user{justify-content:flex-end}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex:0 0 auto;
  background:radial-gradient(circle at 50% 40%, #fff6ea, #e6d6c6);border:1px solid rgba(255,220,180,.35)}
.tstamp{font-size:9.5px;color:rgba(255,240,225,.26);flex:0 0 auto;padding-bottom:3px}
/* 대화 중 PET 반응: 꼬리 흔들림 */
@keyframes tailWag{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
html.typingNow #tailImg{animation:tailWag 1.4s ease-in-out infinite;transform-origin:38% 76%}
/* 키보드 열림: 방은 흐려지고 대화가 주인 */
html.pa-kb-open #petAnchor{top:40%;--pet-w:min(38vw,220px)}

#inputBar{position:absolute;left:calc(14px + var(--pa-left));right:calc(14px + var(--pa-right));
  bottom:calc(var(--pa-bottom) + var(--pa-kb) + 14px);display:flex;gap:8px;align-items:center;transition:bottom .18s ease-out;}
#chatInput{flex:1;height:46px;border-radius:23px;border:1px solid rgba(255,225,190,.12);
  background:rgba(46,34,38,.55);backdrop-filter:blur(10px);color:#fff2e4;font-size:15px;padding:0 18px;outline:none;}
#chatInput::placeholder{color:rgba(255,240,225,.34)}
.roundBtn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,225,190,.12);
  background:rgba(46,34,38,.55);backdrop-filter:blur(10px);color:rgba(255,240,225,.75);
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.roundBtn:active{transform:scale(.93)}

/* ---- Memory Card ---- */
#memoryCard{position:absolute;left:50%;top:34%;transform:translate(-50%,8px);width:min(70%,260px);
  padding:13px 15px;border-radius:14px;
  background:linear-gradient(160deg, rgba(86,62,58,.92), rgba(52,38,42,.92));
  border:1px solid rgba(255,214,170,.22);backdrop-filter:blur(8px);
  color:#ffe9d2;font-size:12.5px;line-height:1.5;box-shadow:0 12px 30px rgba(16,6,4,.5);
  opacity:0;transition:opacity .5s, transform .5s;pointer-events:none;}
#memoryCard.show{opacity:1;transform:translate(-50%,0)}
#memoryCard .mc-tag{font-size:10.5px;letter-spacing:.1em;color:#f0b98c;margin-bottom:5px}

/* ---- UI: 가장 조용한 층 ---- */
#header{position:absolute;top:calc(var(--pa-top) + 14px);left:0;right:0;text-align:center;z-index:5;
  font-size:14px;letter-spacing:.14em;color:rgba(255,240,225,.5);pointer-events:none}

/* ---- 데모 패널 (검증용, 납품 시 제거) ---- */
#demoPanel{position:absolute;left:calc(12px + var(--pa-left));top:calc(var(--pa-top) + 58px);
  display:flex;flex-direction:column;gap:6px;z-index:50}
.demoBtn{padding:7px 11px;border-radius:9px;border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.35);color:rgba(255,255,255,.6);font-size:11px;cursor:pointer;text-align:left}
.demoBtn.on{color:#ffd9a0;border-color:rgba(255,217,160,.4)}
#modeLabel{font-size:10px;color:rgba(255,255,255,.35);padding-left:2px}
#paBadge{position:fixed;left:12px;bottom:12px;z-index:99;display:none;padding:6px 10px;border-radius:8px;
  font-size:10.5px;line-height:1.5;background:rgba(0,0,0,.62);color:#9fe8c0;
  border:1px solid rgba(159,232,192,.3);font-family:ui-monospace,monospace;white-space:pre;}
html.pa-diag #paBadge{display:block}
</style>
</head>

<div id="header">미르</div>

<div id="inputBar">

<script>
/* ====== Asset ======
   배경 제거는 빌드 시점에 완료되어 굽혀 있다(동결 규칙: 흰색+반투명만, flood-fill 영구 금지).
   런타임 가위질 없음 → 어떤 브라우저에서도 동일 렌더 보장. */
const _keyed=document.getElementById('petBody').src;window.keyedPetSrc=_keyed;
['rimLight','bounceLight'].forEach(id=>{const el=document.getElementById(id);
  el.style.webkitMaskImage='url('+_keyed+')';el.style.maskImage='url('+_keyed+')';
  el.style.webkitMaskSize='100% 100%';el.style.maskSize='100% 100%';});

/* ====== Camera + Eye Contact: 시차 + PET가 시선을 따라 갸웃 ====== */
const world=document.getElementById('world'),petAnchor=document.getElementById('petAnchor'),petTilt=document.getElementById('petTilt');
let typingMode=false;
function applyCam(nx,ny){
  world.style.transform='rotateY('+(nx*3)+'deg) rotateX('+(-ny*2)+'deg)';
  petAnchor.style.marginLeft=(nx*9)+'px';petAnchor.style.marginTop=(ny*5)+'px';
  if(!typingMode)petTilt.style.transform='rotateY('+(nx*4)+'deg) rotate('+(nx*1.2)+'deg)'; // Eye Contact 근사
}
let lastPointer=0;
window.addEventListener('pointermove',e=>{lastPointer=Date.now();
  applyCam(((e.clientX/innerWidth)*2-1)*.6,((e.clientY/innerHeight)*2-1)*.6);});
window.addEventListener('deviceorientation',e=>{
  if(e.gamma==null||Date.now()-lastPointer<2000)return;
  applyCam(Math.max(-1,Math.min(1,e.gamma/25)),Math.max(-1,Math.min(1,(e.beta-45)/30)));});

/* Idle Motion: 12~20초마다 한 번 갸웃 */
setInterval(()=>{document.documentElement.classList.add('idleNow');
  setTimeout(()=>document.documentElement.classList.remove('idleNow'),5600);},12000+Math.random()*8000);

/* ====== Ambient ====== */
const amb=document.getElementById('ambient');
for(let i=0;i<12;i++){const m=document.createElement('div');m.className='mote';
  m.style.left=(6+Math.random()*60)+'%';m.style.top=(8+Math.random()*55)+'%';
  m.style.setProperty('--dx',(Math.random()*60-20)+'px');m.style.setProperty('--dy',(30+Math.random()*80)+'px');
  m.style.animationDuration=(9+Math.random()*10)+'s';m.style.animationDelay=(-Math.random()*12)+'s';amb.appendChild(m);}

/* ====== Conversation Layer: 공간의 층. 대화 끝나면 PET가 다시 중심 ====== */
const conv=document.getElementById('conv');let idleT=null;
function stampNow(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function bubble(kind,text){
  document.documentElement.classList.remove('convIdle');
  document.documentElement.classList.add('convOn');
  const row=document.createElement('div');row.className='msgRow '+kind;
  const b=document.createElement('div');b.className='bub '+kind;b.textContent=text;b.style.opacity=1;b.style.transform='none';
  const t=document.createElement('div');t.className='tstamp';t.textContent=stampNow();
  if(kind==='pet'){
    const av=document.createElement('img');av.className='avatar';
    av.src=window.keyedPetSrc||document.getElementById('petBody').src;
    row.appendChild(av);row.appendChild(b);row.appendChild(t);
  }else{row.appendChild(t);row.appendChild(b);}
  conv.appendChild(row);requestAnimationFrame(()=>row.classList.add('in'));
  while(conv.children.length>6)conv.removeChild(conv.firstChild);
  conv.scrollTop=conv.scrollHeight;
  clearTimeout(idleT);
  idleT=setTimeout(()=>{ // 대화 종료 → Conversation 존재감 축소, PET 재중심
    document.documentElement.classList.add('convIdle');
    document.documentElement.classList.remove('convOn');
    setTimeout(()=>{conv.innerHTML='';},900);
  },7000);
}
document.getElementById('sendBtn').onclick=()=>{
  const el=document.getElementById('chatInput'),v=el.value.trim();if(!v)return;el.value='';
  bubble('user',v);
  setTimeout(()=>bubble('pet','응, 듣고 있어. (프로토 — 진짜 두뇌는 본판에)'),700);
};
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('sendBtn').onclick();});
/* 입력 중 PET 반응: 입력창을 살짝 내려다보고, 꼬리를 흔든다 */
const ci=document.getElementById('chatInput');
ci.addEventListener('focus',()=>{typingMode=true;
  document.documentElement.classList.add('typingNow');
  petTilt.style.transform='rotateX(7deg) rotate(0.5deg)';petTilt.style.transition='transform .6s ease';});
ci.addEventListener('blur',()=>{typingMode=false;
  document.documentElement.classList.remove('typingNow');petTilt.style.transform='';});
/* 입력창 문구 로테이션 (지시서 3장) */
const holders=['미르에게 말을 걸어보세요…','오늘은 어떤 이야기를 들려줄까요?'];let hi=0;
setInterval(()=>{hi=(hi+1)%holders.length;document.getElementById('chatInput').placeholder=holders[hi];},8000);

/* ====== Memory Card ====== */
const mc=document.getElementById('memoryCard');
document.getElementById('foldBtn').onclick=function(){
  const g=document.getElementById('moreGroup');g.classList.toggle('open');
  this.textContent=g.classList.contains('open')?'▴ 접기':'▾ 더보기';};
document.getElementById('btnMem').onclick=()=>{
  const chip=document.getElementById('memChip');
  chip.classList.add('hot');setTimeout(()=>chip.classList.remove('hot'),5200);
  bubble('pet','지난번에도 이 이야기를 했었죠. 등산 다녀오신 날이요.');
  setTimeout(()=>{document.getElementById('mcBody').textContent='“주말에 앞산 다녀왔어. 무릎이 좀 아프더라.”';
    mc.classList.add('show');setTimeout(()=>mc.classList.remove('show'),4200);},1200);
};

/* ====== Voice A/B + 터치 반응 ====== */
let mode='A';const petStage=document.getElementById('petStage');
function setMode(m){mode=m;
  document.getElementById('btnModeA').classList.toggle('on',m==='A');
  document.getElementById('btnModeB').classList.toggle('on',m==='B');
  document.getElementById('modeLabel').textContent='현재: '+m+'안';
  document.getElementById('micBtn').style.display=(m==='A')?'flex':'none';}
document.getElementById('btnModeA').onclick=()=>setMode('A');
document.getElementById('btnModeB').onclick=()=>setMode('B');
document.getElementById('micBtn').onclick=()=>bubble('pet','(A안) 듣고 있어요 — 말씀하세요.');
document.getElementById('petHit').onclick=()=>{
  petStage.classList.remove('petReact');void petStage.offsetWidth;petStage.classList.add('petReact');
  setTimeout(()=>bubble('pet',mode==='B'?'(B안) 불렀어? 이야기하자.':'히힛, 간지러워.'),350);};
setMode('A');

/* ====== Test 5: PET 숨기기 — 공간만으로 살아있는가 ====== */
document.getElementById('btnHide').onclick=function(){
  document.documentElement.classList.toggle('petHidden');
  this.classList.toggle('on');
  this.textContent=document.documentElement.classList.contains('petHidden')?'PET 보이기':'PET 숨기기 (Test 5)';};

/* ====== Phase 3 · Platform Adapter: Device → Capability → Renderer ====== */
const PA={device:'unknown',os:'unknown',caps:{},
  detect(){
    const ua=navigator.userAgent;
    const iOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    this.os=iOS?'iOS':(/Android/.test(ua)?'Android':'Other');
    const short=Math.min(innerWidth,innerHeight),ar=innerWidth/innerHeight;
    if(this.os==='Android'&&ar>0.82&&ar<1.25&&short>=580)this.device='fold-open';
    else if(this.os==='Android'&&ar<0.48)this.device='fold-closed';
    else if(short>=600)this.device='tablet';
    else this.device='phone';
    document.documentElement.className=document.documentElement.className
      .replace(/\bpa-(phone|tablet|fold-open|fold-closed)\b/g,'').trim();
    document.documentElement.classList.add('pa-'+this.device);this.badge();},
  capability(){ // 기기 이름이 아니라 능력으로 판단한다
    this.caps={
      touch:'ontouchstart' in window,
      hover:matchMedia('(hover:hover)').matches,
      gyro:'DeviceOrientationEvent' in window,
      mask:CSS.supports('mask-image','url(x)')||CSS.supports('-webkit-mask-image','url(x)'),
      blur:CSS.supports('backdrop-filter','blur(1px)')||CSS.supports('-webkit-backdrop-filter','blur(1px)'),
      vv:!!window.visualViewport,
      reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches};
    if(this.caps.reducedMotion){ // 능력에 따른 렌더 조정 예시
      document.querySelectorAll('.mote').forEach(m=>m.style.display='none');}
  },
  kb(){if(!window.visualViewport)return;const vv=window.visualViewport;
    const u=()=>{const kb=Math.max(0,innerHeight-vv.height-vv.offsetTop);
      document.documentElement.style.setProperty('--pa-kb',kb+'px');
      document.documentElement.classList.toggle('pa-kb-open',kb>60);this.badge();};
    vv.addEventListener('resize',u);vv.addEventListener('scroll',u);u();},
  nav(){if(this.os!=='Android')return;history.pushState({pa:1},'');
    window.addEventListener('popstate',()=>{history.pushState({pa:1},'');
      bubble('pet','(Adapter) 뒤로가기 흡수 — 오버레이 닫기 자리');});},
  badge(){const el=document.getElementById('paBadge');if(!el)return;
    const c=this.caps;
    el.textContent='PA diag\nos: '+this.os+'  device: '+this.device+
      '\nviewport: '+innerWidth+'x'+innerHeight+
      '\ncaps: '+Object.keys(c).filter(k=>c[k]).join(' ')+
      '\nkb: '+getComputedStyle(document.documentElement).getPropertyValue('--pa-kb').trim();},
  init(){this.detect();this.capability();this.kb();this.nav();
    let t;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>this.detect(),180);});
    window.addEventListener('orientationchange',()=>setTimeout(()=>this.detect(),250));}};
PA.init();
document.getElementById('btnPA').onclick=()=>{
  document.documentElement.classList.toggle('pa-diag');PA.badge();};
</script>
</body>
