<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MYAIPET LS v3.6.1 · Session Gov</title>
<style>
/* ============================================================
   LS-0 v1.2 — Phase 1 Living Space > Phase 2 Conversation
   > Phase 3 Platform Adapter > Phase 4 PET Integration
   Engine 무접촉. 목업(대화창1) 무드 반영: 따뜻한 저녁 방.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pa-top:env(safe-area-inset-top,0px);--pa-bottom:env(safe-area-inset-bottom,0px);
  --pa-left:env(safe-area-inset-left,0px);--pa-right:env(safe-area-inset-right,0px);
  --pa-kb:0px;--pet-w:min(61vw,340px);}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#171019}

#camera{position:fixed;inset:0;perspective:950px;perspective-origin:50% 40%;}
#world{position:absolute;inset:0;transition:transform .4s cubic-bezier(.2,.7,.3,1);}

/* ---- Phase 1 · Room: 따뜻한 저녁 방 ---- */
#room{position:absolute;inset:0;overflow:hidden;background:#171019}
#roomImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;transform:scale(1.08)}
/* ---- Ambient: 따뜻한 빛가루 ---- */
#ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,214,160,.4);filter:blur(1px);animation:drift linear infinite;}
@keyframes drift{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.55}88%{opacity:.4}100%{transform:translate3d(var(--dx),var(--dy),0);opacity:0}}

/* ---- Lighting ---- */
#lighting{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(140% 110% at 50% 50%, transparent 58%, rgba(10,6,12,.42) 100%);}

/* ---- Phase 4 · PET ---- */
#petAnchor{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:var(--pet-w);transition:top .8s ease, width .8s ease;}
#petTilt{position:relative;width:100%;transition:transform .5s ease-out;}
#petStage{position:relative;width:100%;padding-top:125%;animation:breathe 4.2s ease-in-out infinite;transform-origin:50% 92%;}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5%) scale(1.012,1.005)}}
/* Idle Motion: 이따금 갸웃 */
@keyframes idleSway{0%,100%{transform:rotate(0)}30%{transform:rotate(1.4deg)}60%{transform:rotate(-1deg)}}
.idleNow #petStage{animation:breathe 4.2s ease-in-out infinite, idleSway 5.5s ease-in-out 1}
#contactShadow{position:absolute;left:50%;bottom:-4%;width:72%;height:11%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%, rgba(20,8,4,.6), rgba(20,8,4,.3) 55%, transparent 75%);
  filter:blur(6px);animation:shadowBreathe 4.2s ease-in-out infinite;}
@keyframes shadowBreathe{0%,100%{transform:translateX(-50%) scale(1);opacity:1}50%{transform:translateX(-50%) scale(.94);opacity:.8}}
#ambientShadow{position:absolute;left:50%;bottom:-8%;width:150%;height:40%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(50% 55% at 50% 60%, rgba(24,10,8,.42), transparent 70%);filter:blur(18px);}
#petGlow{position:absolute;inset:-6%;pointer-events:none;z-index:-1;
  background:radial-gradient(50% 46% at 46% 42%, rgba(255,214,170,.16), transparent 68%);}
.petLayerImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  user-select:none;-webkit-user-drag:none;}
#petHit{position:absolute;inset:0;cursor:pointer}
.petReact{animation:react .55s cubic-bezier(.3,1.6,.4,1) !important}
@keyframes react{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-4%) scale(1.05,.97)}60%{transform:translateY(0) scale(.985,1.02)}100%{transform:translateY(0) scale(1)}}
html.petHidden #petAnchor{opacity:0;pointer-events:none;transition:opacity .5s}

/* ---- Context Panel: 기능 메뉴가 아니라 PET 상태 패널 ---- */
#ctxPanel{position:absolute;right:calc(12px + var(--pa-right));top:calc(var(--pa-top) + 52px);
  display:flex;flex-direction:column;gap:13px;max-width:36%;align-items:flex-end;}
.ls-item{text-align:right;color:rgba(255,240,225,.6);pointer-events:none}
.ls-title{font-size:12px;letter-spacing:.05em;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.ls-sub{font-size:10.5px;color:rgba(255,240,225,.38);margin-top:2px;line-height:1.4}
.ls-dot{width:6px;height:6px;border-radius:50%;background:#f0b98c;box-shadow:0 0 8px rgba(240,185,140,.8);animation:pulse 3s ease-in-out infinite}
.ls-item:nth-child(2) .ls-dot{background:#a5f0c0;box-shadow:0 0 8px rgba(165,240,192,.8);animation-delay:.8s}
.ls-item:nth-child(3) .ls-dot{background:#9fb8f0;box-shadow:0 0 8px rgba(159,184,240,.8);animation-delay:1.6s}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.ctxDivider{width:44px;height:1px;background:rgba(255,240,225,.12);margin:2px 0}
/* 중단: 기억 — 평소엔 숨죽이고, 사건 때만 ● 로 살아난다 (상황형) */
#memChip{font-size:11.5px;color:rgba(255,240,225,.30);cursor:pointer;padding:4px 2px;transition:color .4s;text-align:right}
#memChip.hot{color:#ffd9a0;animation:memGlow 1.6s ease-in-out 3}
#memChip.hot::before{content:'● ';color:#ffb36b}
@keyframes memGlow{0%,100%{text-shadow:none}50%{text-shadow:0 0 12px rgba(255,180,110,.9)}}
/* 하단: 접힘 그룹 — 관계·설정. 설정이 먼저 보이면 실패 */
#foldBtn{font-size:11px;color:rgba(255,240,225,.25);cursor:pointer;padding:2px 4px;background:none;border:none}
#moreGroup{display:none;flex-direction:column;gap:9px;align-items:flex-end}
#moreGroup.open{display:flex}
.ctxItem{font-size:11.5px;color:rgba(255,240,225,.34);cursor:pointer;text-align:right}
.ctxItem small{display:block;font-size:9.5px;color:rgba(255,240,225,.22);margin-top:1px}
html.convOn #ctxPanel{opacity:.25;transition:opacity .4s}
html.pa-kb-open #ctxPanel{opacity:0;transition:opacity .2s}

/* ---- Phase 2 · Conversation Layer: 메신저가 아니라 공간의 층 ---- */
#conv{position:absolute;left:12px;right:12px;bottom:calc(var(--pa-bottom) + var(--pa-kb) + 76px);
  display:flex;flex-direction:column;gap:8px;align-items:stretch;pointer-events:none;
  max-height:32vh;overflow-y:auto;scrollbar-width:none;transition:opacity .8s;}
#conv::-webkit-scrollbar{display:none}
html.convIdle #conv{opacity:0}
.bub{max-width:76%;padding:11px 15px;font-size:14.5px;line-height:1.55;
  opacity:0;transform:translateY(8px);transition:opacity .4s, transform .4s;}
.bub.in{opacity:1;transform:translateY(0)}
.bub.pet{align-self:flex-start;color:#fff4e8;border-radius:20px 20px 20px 6px;
  background:rgba(64,48,52,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(255,220,180,.14);}
.bub.user{align-self:flex-end;color:#efeaff;border-radius:16px 16px 6px 16px;
  background:rgba(84,72,140,.42);backdrop-filter:blur(10px);border:1px solid rgba(200,190,255,.12);}
/* 기준 UI(목업) 채택분: PET 아바타 + 작은 시간. 읽음표시·온라인표시·방제목은 영구 금지 */
.msgRow{display:flex;gap:8px;align-items:flex-end;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.msgRow.in{opacity:1;transform:translateY(0)}
.msgRow.user{justify-content:flex-end}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex:0 0 auto;
  background:radial-gradient(circle at 50% 40%, #fff6ea, #e6d6c6);border:1px solid rgba(255,220,180,.35)}
.tstamp{font-size:9.5px;color:rgba(255,240,225,.26);flex:0 0 auto;padding-bottom:3px}
/* 대화 중 PET 반응: 꼬리 흔들림 */
@keyframes tailWag{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
html.typingNow #tailImg{animation:tailWag 1.4s ease-in-out infinite;transform-origin:38% 76%}
/* 키보드 열림: 방은 흐려지고 대화가 주인 */
html.pa-kb-open #petAnchor{top:40%;--pet-w:min(38vw,220px)}
/* Platform Adapter 기기 프로파일 (v1.2 재건축 때 누락 → v2.4 복원 + desktop 신설) */
html.pa-desktop{--pet-w:min(34vw,560px)}          /* phone 대비 +65%(카메라줌 합산 체감 +30~40%) */
html.pa-desktop #petAnchor{top:55%}
/* Camera Zoom: 넓은 화면에선 방으로 반걸음 다가간다 */
html.pa-desktop #roomImg{transform:scale(1.18);object-position:50% 52%}
/* UI 폭 재조정: 1920px 통짜 입력줄 금지 — 중앙 680px */
html.pa-desktop #inputBar{left:50%;right:auto;transform:translateX(-50%);width:min(680px,92vw)}
html.pa-desktop #conv{left:50%;right:auto;transform:translateX(-50%);width:min(680px,92vw)}
html.pa-tablet #camera{perspective:1150px}
html.pa-tablet{--pet-w:min(38vw,400px)}  /* phone 대비 +18% */
html.pa-fold-open{--pet-w:min(30vw,340px)}
html.pa-fold-open #camera{perspective:1300px}
html.pa-fold-closed{--pet-w:min(62vw,300px)}

#inputBar{position:absolute;left:calc(14px + var(--pa-left));right:calc(14px + var(--pa-right));
  bottom:calc(var(--pa-bottom) + var(--pa-kb) + 14px);display:flex;gap:8px;align-items:center;transition:bottom .18s ease-out;}
#chatInput{flex:1;height:46px;border-radius:23px;border:1px solid rgba(255,225,190,.12);
  background:rgba(46,34,38,.55);backdrop-filter:blur(10px);color:#fff2e4;font-size:15px;padding:0 18px;outline:none;}
#chatInput::placeholder{color:rgba(255,240,225,.34)}
.roundBtn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,225,190,.12);
  background:rgba(46,34,38,.55);backdrop-filter:blur(10px);color:rgba(255,240,225,.75);
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.roundBtn:active{transform:scale(.93)}

/* ---- Memory Card ---- */
#memoryCard{position:absolute;left:50%;top:34%;transform:translate(-50%,8px);width:min(70%,260px);
  padding:13px 15px;border-radius:14px;
  background:linear-gradient(160deg, rgba(86,62,58,.92), rgba(52,38,42,.92));
  border:1px solid rgba(255,214,170,.22);backdrop-filter:blur(8px);
  color:#ffe9d2;font-size:12.5px;line-height:1.5;box-shadow:0 12px 30px rgba(16,6,4,.5);
  opacity:0;transition:opacity .5s, transform .5s;pointer-events:none;cursor:pointer;}
#memoryCard.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#memoryCard .mc-tag{font-size:10.5px;letter-spacing:.1em;color:#f0b98c;margin-bottom:5px}

/* ---- UI: 가장 조용한 층 ---- */
#header{position:absolute;top:calc(var(--pa-top) + 14px);left:0;right:0;text-align:center;z-index:5;
  font-size:14px;letter-spacing:.14em;color:rgba(255,240,225,.5);pointer-events:none}

/* ---- Slide Panel: Living Space를 떠나지 않는다 ---- */
#panelDim{position:fixed;inset:0;background:rgba(10,6,12,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
#panelDim.on{opacity:1;pointer-events:auto}
#slidePanel{position:fixed;top:0;bottom:0;right:0;width:min(78vw,340px);z-index:61;
  background:rgba(34,26,32,.92);backdrop-filter:blur(14px);
  border-left:1px solid rgba(255,220,180,.12);
  padding:calc(var(--pa-top) + 18px) 18px calc(var(--pa-bottom) + 18px);
  transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.3,1);
  overflow-y:auto;scrollbar-width:none;color:#ffeeda;}
#slidePanel::-webkit-scrollbar{display:none}
#slidePanel.on{transform:translateX(0)}
.sp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sp-title{font-size:15px;letter-spacing:.06em;color:rgba(255,240,225,.85)}
.sp-close{background:none;border:none;color:rgba(255,240,225,.5);font-size:18px;cursor:pointer;padding:4px}
.sp-sub{font-size:11px;color:rgba(255,240,225,.4);margin-bottom:14px;line-height:1.5}
.memCat{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:9px;border:1px solid rgba(255,255,255,.05)}
.memCat .mc-name{font-size:13.5px;color:rgba(255,240,225,.85)}
.memCat .mc-recent{font-size:11px;color:rgba(255,240,225,.42);margin-top:4px;line-height:1.45}
.memCat .mc-recent b{color:rgba(255,217,160,.75);font-weight:normal}
.memCat.ours{background:linear-gradient(160deg,rgba(90,110,180,.18),rgba(60,70,120,.12));border-color:rgba(140,170,255,.22)}

#demoPanel{position:absolute;left:calc(12px + var(--pa-left));top:calc(var(--pa-top) + 58px);
  display:flex;flex-direction:column;gap:6px;z-index:50}
.demoBtn{padding:7px 11px;border-radius:9px;border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.35);color:rgba(255,255,255,.6);font-size:11px;cursor:pointer;text-align:left}
.demoBtn.on{color:#ffd9a0;border-color:rgba(255,217,160,.4)}
#modeLabel{font-size:10px;color:rgba(255,255,255,.35);padding-left:2px}

/* ---- Stage 3: Birth Overlay (Golden Brain 소환 창 — 재구현 0) ---- */
#birthOverlay{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;
  background:radial-gradient(120% 90% at 50% 20%, #3a2c33 0%, #241a26 45%, #120c16 100%);
  transition:opacity 1.2s ease, transform 1.2s ease}
#birthOverlay.on{display:flex}
#birthOverlay.out{opacity:0;transform:scale(1.03);pointer-events:none}
#boIntro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:rgba(255,238,218,.8);font-size:15px;letter-spacing:.08em;gap:22px;transition:opacity .8s;z-index:2}
#boIntro.gone{opacity:0;pointer-events:none}
#boGlow{width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,220,170,.9), rgba(255,190,130,.25) 55%, transparent 75%);
  animation:boPulse 1.6s ease-in-out infinite}
@keyframes boPulse{0%,100%{transform:scale(.8);opacity:.7}50%{transform:scale(1.15);opacity:1}}
#birthFrame{opacity:0;transition:opacity 1s ease}
#birthFrame.in{opacity:1}
#birthBar{padding:calc(var(--pa-top) + 10px) 14px 10px;background:rgba(30,22,40,.95);
  color:#ffe9c8;font-size:13px;line-height:1.5;display:flex;align-items:center;gap:10px}
#birthBar button{margin-left:auto;padding:8px 14px;border-radius:9px;border:1px solid rgba(255,217,160,.4);
  background:rgba(255,217,160,.12);color:#ffd9a0;font-size:13px}
#birthBar button:disabled{opacity:.35}
#birthFrame{flex:1;border:0;width:100%}
/* ---- WO-UX-003: First Encounter (Presentation Layer only — GB 무접촉) ---- */
#birthBar{position:relative;z-index:6}
#birthVeil{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(120% 90% at 50% 20%, #3a2c33 0%, #241a26 45%, #120c16 100%);
  color:#ffeeda;font-size:15px;letter-spacing:.06em;opacity:0;transition:opacity .9s ease;pointer-events:none;text-align:center;line-height:1.7}
#birthVeil.on{opacity:1;pointer-events:auto}
#bvGlow{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle, rgba(255,220,170,.9), rgba(255,190,130,.25) 55%, transparent 75%);animation:boPulse 1.6s ease-in-out infinite}
#bvCap{text-align:center;min-height:130px;padding:0 24px}
.bvLine{opacity:0;transform:translateY(7px);transition:opacity .6s ease,transform .6s ease;font-size:16px;letter-spacing:.05em;line-height:2;color:#ffeeda}
.bvLine.in{opacity:1;transform:none}
#doorL,#doorR{position:fixed;top:0;bottom:0;width:51%;z-index:320;pointer-events:none;visibility:hidden;
  background:linear-gradient(165deg,#3b2c34 0%,#241a26 55%,#120c16 100%);
  transition:transform 1.7s cubic-bezier(.7,0,.22,1)}
#doorL{left:0;box-shadow:inset -18px 0 34px rgba(0,0,0,.45)}
#doorR{right:0;box-shadow:inset 18px 0 34px rgba(0,0,0,.45)}
html.doorsMounted #doorL,html.doorsMounted #doorR{visibility:visible}
html.doorOpen #doorL{transform:translateX(-102%)}
html.doorOpen #doorR{transform:translateX(102%)}
#doorSeam{position:fixed;top:0;bottom:0;left:50%;width:3px;z-index:321;transform:translateX(-50%);visibility:hidden;
  background:linear-gradient(rgba(255,220,170,0),rgba(255,224,176,.95) 30%,rgba(255,224,176,.95) 70%,rgba(255,220,170,0));
  filter:blur(1px);box-shadow:0 0 28px 8px rgba(255,200,140,.55);opacity:0;transition:opacity .6s}
html.doorsMounted #doorSeam{visibility:visible}
html.doorSeamOn #doorSeam{opacity:1}
#roomDim{position:absolute;inset:0;background:rgba(8,4,10,.86);z-index:30;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
html.lightsDown #roomDim{opacity:1}
html.encounterOn #inputBar,html.encounterOn #demoPanel,html.encounterOn #ctxPanel{opacity:0;pointer-events:none;transition:opacity .6s}
html.encounterOn #petHit{pointer-events:none}
#camera{transition:transform 2.4s cubic-bezier(.2,.6,.2,1)}
html.doorPush #camera{transform:scale(1.05)}
#petSpeech{position:absolute;left:50%;bottom:103%;transform:translate(-50%,8px);min-width:60px;max-width:72vw;width:max-content;
  padding:11px 15px;border-radius:15px;background:rgba(32,23,36,.9);color:#ffeeda;font-size:14.5px;line-height:1.55;white-space:pre-line;
  border:1px solid rgba(255,220,180,.28);box-shadow:0 10px 30px rgba(0,0,0,.35);
  opacity:0;transition:opacity .5s ease, transform .5s ease;pointer-events:none;z-index:8;text-align:center}
#petSpeech.show{opacity:1;transform:translate(-50%,0)}
#petSpeech::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:rgba(32,23,36,.9)}
#idDiag{position:fixed;left:70px;bottom:16px;z-index:98;font-size:9px;color:rgba(160,220,255,.55);font-family:monospace}
#conv .msgRow.fade{opacity:0 !important;transform:translateY(8px) !important;transition:opacity .65s ease, transform .65s ease}
#traceDiag{position:fixed;right:8px;bottom:6px;z-index:98;font-size:9px;color:rgba(180,255,200,.55);font-family:monospace;max-width:58vw;overflow:hidden;white-space:nowrap}
#paBadge{position:fixed;left:12px;bottom:12px;z-index:99;display:none;padding:6px 10px;border-radius:8px;
  font-size:10.5px;line-height:1.5;background:rgba(0,0,0,.62);color:#9fe8c0;
  border:1px solid rgba(159,232,192,.3);font-family:ui-monospace,monospace;white-space:pre;}
html.pa-diag #paBadge{display:block}
</style>
</head>

<script>
/* ====== Asset ======
   배경 제거는 빌드 시점에 완료되어 굽혀 있다(동결 규칙: 흰색+반투명만, flood-fill 영구 금지).
   런타임 가위질 없음 → 어떤 브라우저에서도 동일 렌더 보장. */
window.keyedPetSrc=document.getElementById('petBody').src;
/* 계기판: 폰 디코더가 알파를 살리는지 실측 (수리는 안 함 — 관찰만. v17.3 교훈: 검증하고 선택) */
window._petAlpha='측정전';
(function(){const pb=document.getElementById('petBody');
  function probe(){try{
    const w=pb.naturalWidth,h=pb.naturalHeight;
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d');cx.drawImage(pb,0,0);
    const P=(x,y)=>cx.getImageData(x,y,1,1).data[3];
    window._petAlpha='몸통'+P(Math.round(w/2),Math.round(h*0.62))
      +' 배경'+P(5,Math.round(h/2))+' 모서리'+P(2,2);
  }catch(e){window._petAlpha='err:'+e.name;}}
  pb.complete?probe():pb.addEventListener('load',probe);})();

/* ====== Camera + Eye Contact: 시차 + PET가 시선을 따라 갸웃 ====== */
const world=document.getElementById('world'),petAnchor=document.getElementById('petAnchor'),petTilt=document.getElementById('petTilt');
let typingMode=false;
function applyCam(nx,ny){
  world.style.transform='rotateY('+(nx*3)+'deg) rotateX('+(-ny*2)+'deg)';
  petAnchor.style.marginLeft=(nx*9)+'px';petAnchor.style.marginTop=(ny*5)+'px';
  if(!typingMode)petTilt.style.transform='rotateY('+(nx*4)+'deg) rotate('+(nx*1.2)+'deg)'; // Eye Contact 근사
}
let lastPointer=0;
window.addEventListener('pointermove',e=>{lastPointer=Date.now();
  applyCam(((e.clientX/innerWidth)*2-1)*.6,((e.clientY/innerHeight)*2-1)*.6);});
window.addEventListener('deviceorientation',e=>{
  if(e.gamma==null||Date.now()-lastPointer<2000)return;
  applyCam(Math.max(-1,Math.min(1,e.gamma/25)),Math.max(-1,Math.min(1,(e.beta-45)/30)));});

/* Idle Motion: 12~20초마다 한 번 갸웃 */
setInterval(()=>{document.documentElement.classList.add('idleNow');
  setTimeout(()=>document.documentElement.classList.remove('idleNow'),5600);},12000+Math.random()*8000);

/* ====== Ambient ====== */
const amb=document.getElementById('ambient');
for(let i=0;i<12;i++){const m=document.createElement('div');m.className='mote';
  m.style.left=(6+Math.random()*60)+'%';m.style.top=(8+Math.random()*55)+'%';
  m.style.setProperty('--dx',(Math.random()*60-20)+'px');m.style.setProperty('--dy',(30+Math.random()*80)+'px');
  m.style.animationDuration=(9+Math.random()*10)+'s';m.style.animationDelay=(-Math.random()*12)+'s';amb.appendChild(m);}

/* ====== Conversation Lifecycle v1.0 (WO-UX-005) ======
   Bubble = 대화의 생명주기 인터페이스. 삭제 기준: Context > Speech > Timer.
   상태기계: Created→Waiting→Speaking→Holding→FadeOut→Destroyed. 말풍선별 독립 타이머. */
const conv=document.getElementById('conv');
function stampNow(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
const BL={pendingUsers:[],ttsWaiters:[],
  readMs(t){return Math.min(45000, 8000 + String(t||'').length*150);},
  setState(row,st){row.dataset.state=st;},
  destroy(row){if(!row||row.dataset.state==='fadeout'||row.dataset.state==='destroyed')return;
    this.setState(row,'fadeout');row.classList.add('fade');
    setTimeout(()=>{this.setState(row,'destroyed');try{row.remove();}catch(e){}
      if(!conv.children.length){document.documentElement.classList.add('convIdle');
        document.documentElement.classList.remove('convOn');}},700);},
  onTtsDone(){const ws=this.ttsWaiters.slice();this.ttsWaiters=[];ws.forEach(f=>{try{f();}catch(e){}});}};
document.addEventListener('sa-tts-done',()=>BL.onTtsDone());
function bubble(kind,text,opt){
  opt=opt||{};
  document.documentElement.classList.remove('convIdle');
  document.documentElement.classList.add('convOn');
  const row=document.createElement('div');row.className='msgRow '+kind;
  const clean=String(text||'').split('**').join('').split('##').join('').split('###').join('');
  const b=document.createElement('div');b.className='bub '+kind;b.textContent=clean;b.style.opacity=1;b.style.transform='none';
  const t=document.createElement('div');t.className='tstamp';t.textContent=stampNow();
  if(kind==='pet'){
    const av=document.createElement('img');av.className='avatar';
    av.src=window.keyedPetSrc||document.getElementById('petBody').src;
    row.appendChild(av);row.appendChild(b);row.appendChild(t);
  }else{row.appendChild(t);row.appendChild(b);}
  conv.appendChild(row);requestAnimationFrame(()=>row.classList.add('in'));
  while(conv.children.length>8)BL.destroy(conv.firstChild);
  conv.scrollTop=conv.scrollHeight;
  row._textEl=b;BL.setState(row,'created');
  if(kind==='user'){
    /* User Bubble Contract: 최소 8초 AND PET 답변 출력 AND 답변 후 2초 */
    BL.setState(row,'waiting');
    const born=Date.now();
    row._answered=null;
    row._resolveUser=()=>{ if(row._answered==null)return;
      const dieAt=Math.max(born+8000, row._answered+2000);
      setTimeout(()=>BL.destroy(row), Math.max(0,dieAt-Date.now()));};
    BL.pendingUsers.push(row);
    return row;
  }
  /* PET Bubble */
  if(opt.searching){BL.setState(row,'waiting');return row;} /* 답변으로 Morph될 때까지 생명주기 보류 */
  petAnswerLifecycle(row,clean);
  return row;
}
function petAnswerLifecycle(row,textShown){
  /* Context: 이 답변이 대기 중 질문들을 해소 → 질문 삭제 타이머 가동 */
  const now=Date.now();
  BL.pendingUsers.forEach(u=>{if(u._answered==null){u._answered=now;u._resolveUser();}});
  BL.pendingUsers=BL.pendingUsers.filter(u=>u._answered==null);
  const rMs=BL.readMs(textShown);
  if(ttsOn){
    /* Speech: TTS 종료 + 2초. Timer는 최후 보루(max(8s,읽기시간)+15s 상한 가드) */
    BL.setState(row,'speaking');
    let done=false;const finish=()=>{if(done)return;done=true;
      BL.setState(row,'holding');setTimeout(()=>BL.destroy(row),2000);};
    BL.ttsWaiters.push(finish);
    setTimeout(finish, rMs+15000); /* 가드: Speech 신호 유실 시에도 결국 정리 */
  }else{
    BL.setState(row,'holding');
    setTimeout(()=>BL.destroy(row), Math.max(8000,rMs));
  }
}
function bubbleMorph(row,newText,asAnswer){
  /* Searching Bubble Contract: 삭제·재생성 금지 — 같은 말풍선이 자란다 */
  if(!row||!row._textEl)return;
  const clean=String(newText||'').split('**').join('').split('##').join('').split('###').join('');
  row._textEl.style.transition='opacity .25s';row._textEl.style.opacity=0.25;
  setTimeout(()=>{row._textEl.textContent=clean;row._textEl.style.opacity=1;
    conv.scrollTop=conv.scrollHeight;
    if(asAnswer)petAnswerLifecycle(row,clean);},260);
}
/* ====== EC-02 Stage 1: 두뇌·목소리 연결 ======
   본판 v17.5 호출 규격 재사용(mp-proxy = LLM Adapter 상당). Engine Object 무접촉.
   본판 localStorage 계약 개정판(GS 승인 2026-08-03, LS=주무대): facts 필드만 추가 가능(중복 제거·40건 상한 — 본판과 동일 규칙).
   정체성(petName·userName)·레벨·경험치·기타 필드는 여전히 불가침. st_slot·st_voice_map은 읽기 전용 유지. */

function saClassify(text){

  if(!s)return{intent:'Conversation',matched:[],markers:[],rule:'empty'};
  const ms=[];
  SA_DICT.strong.forEach(t=>{if(s.indexOf(t)>=0)ms.push(t);});
  SA_DICT.strongPatterns.forEach(t=>{if(s.indexOf(t)>=0)ms.push(t);});
  const mk=SA_DICT.requestMarkers.filter(t=>s.indexOf(t)>=0);
  const wk=SA_DICT.weakTime.filter(t=>s.indexOf(t)>=0);
  if((ms.length||wk.length)&&mk.length)return{intent:'Realtime',matched:ms,markers:mk,rule:'marker'};

/* ====== Phase 3 · Platform Adapter: Device → Capability → Renderer ====== */
const PA={device:'unknown',os:'unknown',caps:{},
  detect(){
    const ua=navigator.userAgent;
    const iOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    this.os=iOS?'iOS':(/Android/.test(ua)?'Android':'Other');
    const short=Math.min(innerWidth,innerHeight),ar=innerWidth/innerHeight;
    if(this.os==='Android'&&ar>0.82&&ar<1.25&&short>=580)this.device='fold-open';
    else if(this.os==='Android'&&ar<0.48)this.device='fold-closed';
    else if(matchMedia('(hover:hover) and (pointer:fine)').matches)this.device='desktop';
    else if(short>=600)this.device='tablet';
    else this.device='phone';
    document.documentElement.className=document.documentElement.className
      .replace(/\bpa-(phone|tablet|desktop|fold-open|fold-closed)\b/g,'').trim();
    document.documentElement.classList.add('pa-'+this.device);this.badge();},
  capability(){ // 기기 이름이 아니라 능력으로 판단한다
    this.caps={
      touch:'ontouchstart' in window,
      hover:matchMedia('(hover:hover)').matches,
      gyro:'DeviceOrientationEvent' in window,
      mask:CSS.supports('mask-image','url(x)')||CSS.supports('-webkit-mask-image','url(x)'),
      blur:CSS.supports('backdrop-filter','blur(1px)')||CSS.supports('-webkit-backdrop-filter','blur(1px)'),
      vv:!!window.visualViewport,
      reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches};
    if(this.caps.reducedMotion){ // 능력에 따른 렌더 조정 예시
      document.querySelectorAll('.mote').forEach(m=>m.style.display='none');}
  },
  kb(){if(!window.visualViewport)return;const vv=window.visualViewport;
    const u=()=>{const kb=Math.max(0,innerHeight-vv.height-vv.offsetTop);
      document.documentElement.style.setProperty('--pa-kb',kb+'px');
      document.documentElement.classList.toggle('pa-kb-open',kb>60);this.badge();};
    vv.addEventListener('resize',u);vv.addEventListener('scroll',u);u();},
  nav(){if(this.os!=='Android')return;history.pushState({pa:1},'');
    window.addEventListener('popstate',()=>{history.pushState({pa:1},'');
      if(typeof spOpen!=='undefined'&&spOpen){closePanel();}});},
  badge(){const el=document.getElementById('paBadge');if(!el)return;
    const c=this.caps;
    el.textContent='PA diag\nos: '+this.os+'  device: '+this.device+
      '\nviewport: '+innerWidth+'x'+innerHeight+
      '\ncaps: '+Object.keys(c).filter(k=>c[k]).join(' ')+
      '\nkb: '+getComputedStyle(document.documentElement).getPropertyValue('--pa-kb').trim()+'\npetAlpha[몸통/배경/모서리]: '+window._petAlpha;},
  init(){this.detect();this.capability();this.kb();this.nav();
    let t;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>this.detect(),180);});
    window.addEventListener('orientationchange',()=>setTimeout(()=>this.detect(),250));}};

  assess(){
    const raw=localStorage.getItem('myaipet-demo-v10');
    const frozen=localStorage.getItem('ls_identity_frozen')==='1';
    if(raw==null)return{state:'No Identity',nextAction:'BIRTH_REQUIRED'};
    let st;try{st=JSON.parse(raw);}catch(e){return{state:'Recovery',nextAction:'ADMIN_INTERVENTION'};}
    if(st.__schema&&st.__schema!=='myaipet-demo-v10')return{state:'Migration',nextAction:'MIGRATION_CONTRACT'};
    if(!st.petName||!String(st.petName).trim())return{state:'Birth Required',nextAction:'RUN_GOLDEN_BRAIN_BIRTH'};
    if(!frozen)return{state:'Birth Completed',nextAction:'RECORD_FREEZE_ONCE'};
    if(!Array.isArray(st.facts)||!Array.isArray(st.history))return{state:'Recovery',nextAction:'ADMIN_INTERVENTION'};
    return{state:'Identity Frozen',nextAction:'ENTER_LIVING_SPACE'};
  }

             창 생명주기는 Launcher(LS) 소관, GB 코드 무접촉. 창이 닫히면 그 안의 모든 소리가 멈춘다
             (DOM 밖 Audio 객체 경로까지 — 진정 인터벌로는 잡지 못하던 결함의 원천 수리). */
          try{if(fr.contentWindow&&fr.contentWindow.speechSynthesis)fr.contentWindow.speechSynthesis.cancel();}catch(e){}
          try{fr.remove();}catch(e){}
          audit('GREETING_DEFERRED(to:living_space)');audit('BIRTH_WINDOW_CLOSED');
          clearTimeout(tmr);}
      }
    };
    window.addEventListener('storage',e=>{ if(e.key==='myaipet-demo-v10'||e.key==='st_voice_map'){idLog('Save 감지: '+e.key);check();} });
    const poll=setInterval(check,2000);
    let tmr;
    const armTimer=()=>{tmr=setTimeout(()=>{
      if(done||!btnEnter.disabled)return;
      if(retries<MAX_RETRY){retries++;audit('TIMEOUT');audit('RETRY('+retries+')');
        msg.textContent='⏳ 다시 시도 중… ('+retries+'/'+MAX_RETRY+')';
        fr.src='index.html';armTimer();}
      else blocked('⏳ 여러 번 시도했지만 응답이 없어요 — 관리자 확인이 필요해요',['TIMEOUT','ABORT']);
    },180000);};
    armTimer();
    fr.onerror=()=>{ if(!done) blocked('⚠️ 탄생 화면을 불러오지 못했어요 — 관리자 확인이 필요할 수 있어요',['ERROR(LOAD_FAIL)','RECOVERY']); };
    btnCancel.onclick=()=>{ if(btnEnter.disabled) blocked('탄생을 잠시 멈췄어요 — 준비되면 다시 시작해요',['CANCELLED(user_abort)','BIRTH_REQUIRED']);
      else {ov.remove();} };
    btnEnter.onclick=()=>{finish();
      IdentityAdapter.recordFreeze();audit('FREEZE_RECORDED');
      if(resultPayload&&resultPayload.displayName){
        applyIdentity({petName:resultPayload.displayName});
        window.IDENT=Object.assign(window.IDENT||{},{petName:resultPayload.displayName});
        audit('ENTER_LIVING_SPACE');idLog('입장(result 전달 — storage 재독 없음): '+resultPayload.displayName);
        /* WO-UX-003: 페이지 전환이 아니라 문 — 닫힌 문 뒤에서 소환 창을 걷고, 같은 세계에서 방이 열린다 */
        document.documentElement.classList.add('doorsMounted','lightsDown');
        setTimeout(()=>{ov.remove();firstEncounter(resultPayload.displayName);},80);
      } else { audit('ENTER_LIVING_SPACE'); ov.classList.add('out'); setTimeout(()=>{ov.remove();IdentityBoot();},1250); }};
  }
};
/* ====== WO-UX-003: First Encounter Sequence (Presentation Layer only) ======
   Greeting 생성·저장은 Golden Brain 소관(무접촉). LS는 표시 순서만:
   Door → 조명 → Observe(바라봄+갸웃) → Speech Bubble(2단) → Chat History → 입력 활성화 */
/* ====== WO-UX-004: Birth Announcement Voice (Presentation Layer only) ======
   이 음성은 Greeting이 아니다 — 탄생을 세상에 알리는 마지막 의식.
   Voice: 방금 선택된 것 그대로(pickVoice 재사용). 저장 0. 감사: BIRTH_ANNOUNCEMENT_* (Greeting과 분리).
   v4.0.3(GS 제안 채택): TTS는 전체 대본 1회 요청 — 요청 횟수 제한 원천 회피.
   자막 4줄은 오디오 실제 길이를 읽어 문장 길이+숨(…) 가중치로 배분해 음성과 함께 자란다. */
function birthAnnounce(nm,done){
  const cap=document.getElementById('bvCap');
  const lines=[nm+'…','태어났어요.','문을 열면…','우리의 이야기가 시작돼요.'];
  auditObj('BIRTH_ANNOUNCEMENT_STARTED');
  let finished=false;
  const finish=()=>{if(finished)return;finished=true;
    clearTimeout(guard);auditObj('BIRTH_ANNOUNCEMENT_COMPLETED');done();};
  const guard=setTimeout(finish,25000);              /* 안전장치: 어떤 경우에도 문은 열린다 */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const player=new Audio();
  const vid=pickVoice();vDiag('BA voice '+String(vid).slice(0,12));
  const fetchTTS=t=>fetch(PROXY+'/v1/text-to-speech',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({voice_id:vid,text:t,model:'ssfm-v30',language:'kor',output:{audio_format:'mp3'}})})
    .then(r=>r.ok?r.blob():null).then(b=>b?URL.createObjectURL(b):null).catch(()=>null);
  const showCap=i=>{if(!cap||i>=lines.length)return;
    const d=document.createElement('div');d.className='bvLine';d.textContent=lines[i];
    cap.appendChild(d);requestAnimationFrame(()=>d.classList.add('in'));};
  /* 문장 길이 + 숨(…=넉넉히, .=짧게) 가중치로 시작 시점 배분 */
  const weights=lines.map(t=>t.length+(t.indexOf('…')>-1?5:1));
  const totalW=weights.reduce((x,y)=>x+y,0);
  const scheduleCaps=durSec=>{let acc=0;
    for(let i=0;i<lines.length;i++){
      const at=Math.max(0,Math.round(acc/totalW*durSec*1000));
      setTimeout(()=>showCap(i),at);acc+=weights[i];}};
  (async()=>{
    await sleep(300);                                /* 베일 등장 0.3초 */
    let url=await fetchTTS(lines.join(' '));
    if(!url){await sleep(600);url=await fetchTTS(lines.join(' '));}
    if(url){
      player.src=url;
      const playP=player.play();
      const meta=await new Promise(res=>{
        if(isFinite(player.duration)&&player.duration>0)return res(player.duration);
        player.onloadedmetadata=()=>res(isFinite(player.duration)?player.duration:0);
        setTimeout(()=>res(0),1500);});
      const dur=meta>0?meta:(lines.join(' ').length*0.16+2);  /* 길이 미확인 시 글자당 추정 */
      vDiag('BA 재생 '+(Math.round(dur*10)/10)+'s');
      scheduleCaps(dur);
      await new Promise(res=>{let d2=false;const end=()=>{if(!d2){d2=true;res();}};
        player.onended=end;player.onerror=end;
        if(playP&&playP.catch)playP.catch(()=>vDiag('BA 차단 — 자막 진행'));
        setTimeout(end,(dur+1.2)*1000);});
      URL.revokeObjectURL(url);
    }else{
      vDiag('BA tts-fail — 자막 의식으로 진행');
      for(let i=0;i<lines.length;i++){showCap(i);await sleep(1500);}
    }
    await sleep(400);
    finish();
  })();
}
function readBrainGreeting(name){
  try{
    const st=JSON.parse(localStorage.getItem('myaipet-demo-v10'));
    const h=(st&&st.history)||[];
    for(let i=h.length-1;i>=0;i--){
      const m=h[i];if(!m||m.role!=='assistant')continue;
      let t=m.content;
      try{const j=JSON.parse(t);if(j&&j.reply)t=j.reply;}catch(e){}
      if(typeof t==='string'&&t.trim())return t.trim();
    }
  }catch(e){}
  /* 폴백: 본판 v16.0 PRS-001D M1 확정 인사 문구의 재표기(렌더러는 생성하지 않는다) */
  return '안녕! 나는 '+name+'야. 궁금한 걸 물어봐도 되고, 오늘 있었던 일을 이야기해도 돼. 내가 뭐라고 불러주면 좋을까?';
}
function splitGreeting(g){
  const m=g.match(/^(.{1,14}?[!.?…~])[ ]*/);
  if(m&&g.length>m[1].length)return[m[1],g.slice(m[0].length)];
  return['안녕…',g];
}
const petSpeech=document.getElementById('petSpeech');
function firstEncounter(name){
  const H=document.documentElement;
  const greet=readBrainGreeting(name);
  const segs=splitGreeting(greet);
  const FE=t=>idLog('[FE] '+t);
  H.classList.add('encounterOn','lightsDown','doorsMounted','doorPush');
  FE('door closed · lights down');
  setTimeout(()=>H.classList.add('doorSeamOn'),700);
  setTimeout(()=>{H.classList.add('doorOpen');H.classList.remove('doorSeamOn');FE('door opening');},1400);
  setTimeout(()=>{H.classList.remove('lightsDown');H.classList.remove('doorPush');FE('lights on');},2200);
  setTimeout(()=>{H.classList.remove('doorsMounted');H.classList.remove('doorOpen');},3400);
  /* Observe: PET가 사용자를 바라본다 + 한 번 갸웃 (기존 Idle 자산 재사용) */
  setTimeout(()=>{H.classList.add('idleNow');petTilt.style.transform='rotateY(0deg) rotate(0.8deg)';FE('observe');},3000);
  /* 1~2초 Idle 후 첫 마디 */
  setTimeout(()=>{petSpeech.textContent=segs[0];petSpeech.classList.add('show');speak(greet);FE('greeting 1');},4700);
  /* 0.5초 후 본문 */
  setTimeout(()=>{petSpeech.textContent=segs[0]+'\n'+segs[1];FE('greeting 2');},5200);
  /* WO-UX-003 Rev.1 P0-1: 첫 인사는 말풍선에서만 — 사용자에게 보이는 채팅 UI에 중복 기록하지 않는다.
     내부 메모리(hist)·감사 로그는 기존대로 유지. 말풍선은 사용자가 대화를 시작하면 접힌다. */
  setTimeout(()=>{
    hist.push({role:'assistant',content:greet});
    H.classList.remove('encounterOn');H.classList.remove('idleNow');
    petTilt.style.transform='';
    FE('입력 활성화 · 인사는 말풍선만(채팅 중복 기록 없음)');
    const ci2=document.getElementById('chatInput'),sb2=document.getElementById('sendBtn');
    const dismiss=()=>{petSpeech.classList.remove('show');
      ci2.removeEventListener('focus',dismiss);sb2.removeEventListener('click',dismiss);};
    ci2.addEventListener('focus',dismiss);sb2.addEventListener('click',dismiss);
  },8800);
}
function applyIdentity(id){  // 입장: 렌더러에 이름 반영
  window.IDENT=id;
  const hd=document.getElementById('header');if(hd&&id.petName)hd.textContent=id.petName;
  const ci=document.getElementById('chatInput');if(ci&&id.petName)ci.placeholder=id.petName+'에게 말을 걸어보세요…';
}
function IdentityBoot(){  // 부팅 분기 (WO-IMPL-003/004/005/006)
  const v=IdentityGateway.assess();
  idLog('Gateway 판정: '+v.state+' → '+v.nextAction);
  switch(v.nextAction){
    case 'ENTER_LIVING_SPACE': applyIdentity(IdentityAdapter.load()); idLog('입장: Existing User'); recallGreet(); break;
    case 'RECORD_FREEZE_ONCE': IdentityAdapter.recordFreeze(); IdentityBoot(); break;
    case 'BIRTH_REQUIRED': case 'RUN_GOLDEN_BRAIN_BIRTH': IdentityAdapter.openBirth(); break;
    case 'MIGRATION_CONTRACT': idLog('Migration Contract stub — Engine 미구현(계획대로, WO-IMPL-006)'); break;
    case 'ADMIN_INTERVENTION': idLog('Recovery — 자동 복구 금지, Admin 개입 필요'); break;
  }
}
IdentityBoot();

document.getElementById('btnPA').onclick=()=>{
  document.documentElement.classList.toggle('pa-diag');PA.badge();};
</script>
